<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vietverse | Quét thẻ bài AR</title>

<!-- model-viewer: AR native (Android WebXR / Scene Viewer, iOS Quick Look) -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--red:#d32f2f;--gold:#f5c842;}
  html,body{height:100%;background:#180000;color:#fff;font-family:'Be Vietnam Pro',sans-serif;overflow:hidden;}
  #stage{position:fixed;inset:0;z-index:1;}
  #stage video,#stage canvas{position:absolute;top:0;left:0;}
  .chip{position:fixed;z-index:40;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;font-weight:700;}
  #back{top:16px;left:16px;padding:9px 18px;color:#fff;text-decoration:none;font-size:14px;}
  #tag{top:16px;left:50%;transform:translateX(-50%);padding:9px 16px;color:var(--gold);font-size:.85rem;display:none;max-width:50vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #hint{bottom:36px;left:50%;transform:translateX(-50%);padding:10px 22px;font-size:13px;text-align:center;max-width:90vw;display:none;}
  #load{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);font-weight:700;text-align:center;padding:24px;}
  #intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#7a0f0f,#180000);}
  #intro h1{font-family:'Baloo 2',cursive;font-size:clamp(2rem,7vw,3.4rem);line-height:1.15;}
  #intro p{max-width:460px;line-height:1.7;color:rgba(255,255,255,.85);font-size:.95rem;}
  .btn{border:none;border-radius:16px;padding:16px 36px;font:800 1rem 'Be Vietnam Pro',sans-serif;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--red),#ef5350);box-shadow:0 8px 24px rgba(211,47,47,.45);}
  .btn:disabled{opacity:.6;cursor:wait;}
  .btn.ghost{background:rgba(255,255,255,.14);box-shadow:none;padding:12px 28px;font-size:.9rem;}
  #msg{min-height:1.4em;font-size:.88rem;color:#ffcdd2;}

  /* ── Màn xem 3D + vào AR ── */
  #viewer{position:fixed;inset:0;z-index:35;display:none;background:radial-gradient(circle at 50% 30%,#5a0a0a,#180000);}
  #viewer.show{display:block;}
  #mv{width:100%;height:100%;background:transparent;--poster-color:transparent;--progress-bar-color:#f5c842;}
  #vtitle{position:absolute;top:64px;left:0;right:0;text-align:center;font-family:'Baloo 2',cursive;font-size:1.5rem;color:var(--gold);padding:0 20px;pointer-events:none;}
  #arBtn{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);white-space:nowrap;}
  #rescan{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);white-space:nowrap;}
  #vstatus{position:absolute;bottom:150px;left:0;right:0;text-align:center;font-size:.8rem;color:rgba(255,255,255,.75);padding:0 24px;pointer-events:none;}
</style>
</head>
<body>
<div id="stage"></div>
<a class="chip" id="back" href="index.html">← Trang chủ</a>
<div class="chip" id="tag"></div>
<div class="chip" id="hint"></div>
<div id="load"></div>

<div id="viewer">
  <div id="vtitle"></div>
  <model-viewer id="mv"
    ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
    camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1"
    environment-image="neutral" exposure="1" autoplay loading="eager" interaction-prompt="none">
    <button slot="ar-button" id="arBtn" class="btn">Xem trong AR</button>
  </model-viewer>
  <div id="vstatus"></div>
  <button class="btn ghost" id="rescan">Quét thẻ khác</button>
</div>

<div id="intro">
  <h1>Quét thẻ bài<br>Vietverse AR</h1>
  <p>Đưa camera vào thẻ bài di tích để nhận diện. Sau đó bấm "Xem trong AR" để đặt mô hình 3D lên không gian xung quanh bạn.</p>
  <button class="btn" id="go">Bắt đầu quét</button>
  <div id="msg"></div>
</div>

<script type="module">
import { MindARThree } from 'https://esm.sh/mind-ar@1.2.5/dist/mindar-image-three.prod.js?deps=three@0.160.0';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyAq52d5zrc5rN6UFflwb22bJD9GSjdS0ts",
  authDomain: "vvss-b7a49.firebaseapp.com",
  projectId: "vvss-b7a49",
  storageBucket: "vvss-b7a49.firebasestorage.app",
  messagingSenderId: "562837285603",
  appId: "1:562837285603:web:e75d7a983e1ef644c9b3d6"
}));

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hint = $('hint'), tag = $('tag'), loadEl = $('load'), mv = $('mv'), viewer = $('viewer');
let bundle = null, mindar = null, scanning = false;

const setHint = t => { hint.style.display = t ? 'block' : 'none'; hint.textContent = t || ''; };
const setTag = t => { tag.style.display = t ? 'block' : 'none'; tag.textContent = t || ''; };
const showLoad = t => { loadEl.textContent = t; loadEl.style.display = 'flex'; };
const hideLoad = () => loadEl.style.display = 'none';

/* ══════════ Dữ liệu từ Firestore ══════════ */
async function loadBundle() {
  const meta = await getDoc(doc(db, 'ar_bundle', 'meta'));
  if (!meta.exists() || !meta.data().order?.length) throw new Error('Chưa có thẻ bài nào trong hệ thống.');
  const { order, chunkCount } = meta.data();
  const parts = await Promise.all(Array.from({ length: chunkCount }, (_, i) => getDoc(doc(db, 'ar_bundle', 'c' + i))));
  const bytes = Uint8Array.from(atob(parts.map(p => p.data().data).join('')), c => c.charCodeAt(0));
  const items = {};
  (await getDocs(collection(db, 'ar_items'))).forEach(d => items[d.id] = d.data());
  return { order, items, url: URL.createObjectURL(new Blob([bytes])) };
}

/* ══════════ PHA 1: quét thẻ bài (MindAR) — chỉ nhận diện ══════════ */
async function startScan() {
  closeViewer();
  setTag(null); setHint('📷 Đưa camera vào một thẻ bài');
  mindar = new MindARThree({
    container: $('stage'), imageTargetSrc: bundle.url, maxTrack: 1,
    missTolerance: 10, warmupTolerance: 5, uiLoading: 'no', uiScanning: 'no', uiError: 'no'
  });
  let timer = null;
  bundle.order.forEach((id, i) => {
    const item = bundle.items[id]; if (!item) return;
    const anchor = mindar.addAnchor(i);
    anchor.onTargetFound = () => {
      if (timer || !scanning) return;
      setTag(item.name); setHint('✅ Đã nhận diện — giữ yên một chút...');
      timer = setTimeout(() => { timer = null; if (scanning) handoff(item); }, 700);
    };
    anchor.onTargetLost = () => {
      if (timer) { clearTimeout(timer); timer = null; }
      setTag(null); setHint('📷 Đưa camera vào một thẻ bài');
    };
  });
  await mindar.start();
  scanning = true;
}

async function stopScan() {
  scanning = false;
  if (!mindar) return;
  const m = mindar; mindar = null;
  try { m.video?.srcObject?.getTracks().forEach(t => t.stop()); if (m.video) m.video.srcObject = null; } catch {}
  try { m.renderer.setAnimationLoop(null); m.stop(); } catch (e) { console.warn(e); }
  try { m.controller?.dispose?.(); } catch {}
  try { m.renderer.dispose(); m.renderer.forceContextLoss(); m.renderer.domElement.remove(); } catch {}
  $('stage').innerHTML = '';
  await sleep(500);   // đảm bảo camera được nhả trước khi AR native mở
}

/* ══════════ Chuyển pha: nhận diện -> màn xem 3D (AR chạy khi người dùng bấm nút) ══════════ */
async function handoff(item) {
  scanning = false; setHint(null); setTag(null);
  showLoad('Đang chuẩn bị ' + (item.name || '') + '...');
  await stopScan();
  hideLoad();
  openViewer(item);
}

/* ══════════ PHA 2: model-viewer (WebXR / Scene Viewer / Quick Look) ══════════ */
function openViewer(item) {
  $('vtitle').textContent = item.name || 'Vietverse AR';
  $('vstatus').textContent = 'Đang tải mô hình 0%';
  $('arBtn').disabled = true;
  mv.removeAttribute('scale');
  if (item.usdzUrl) mv.setAttribute('ios-src', item.usdzUrl); else mv.removeAttribute('ios-src');
  if (item.loopAnim === false) mv.removeAttribute('autoplay'); else mv.setAttribute('autoplay', '');
  mv.alt = item.name || 'Mô hình 3D';
  mv.dataset.userScale = item.scale || 1;
  mv.src = item.modelUrl;
  viewer.classList.add('show');
}

function closeViewer() {
  viewer.classList.remove('show');
  mv.removeAttribute('src');          // giải phóng model/texture
  mv.removeAttribute('ios-src');
}

mv.addEventListener('progress', e => {
  const p = Math.round((e.detail.totalProgress || 0) * 100);
  if (p < 100) $('vstatus').textContent = 'Đang tải mô hình ' + p + '%';
});
mv.addEventListener('load', () => {
  // Chuẩn hoá kích thước thật: cạnh lớn nhất ≈ 0,4 m (nhân hệ số scale của thẻ)
  try {
    const d = mv.getDimensions(), max = Math.max(d.x, d.y, d.z);
    if (max > 0) {
      const s = 0.4 / max * (parseFloat(mv.dataset.userScale) || 1);
      mv.scale = `${s} ${s} ${s}`;
    }
  } catch (e) { console.warn(e); }
  $('arBtn').disabled = false;
  $('vstatus').textContent = mv.canActivateAR ? 'Bấm "Xem trong AR", hướng camera xuống sàn rồi chạm để đặt.' : 'Thiết bị này chưa hỗ trợ AR — bạn vẫn có thể xoay xem mô hình 3D.';
});
mv.addEventListener('error', e => {
  console.error(e.detail);
  $('vstatus').textContent = 'Không tải được mô hình. Hãy thử quét lại.';
});
mv.addEventListener('ar-status', e => {
  if (e.detail.status === 'failed') $('vstatus').textContent = 'Không mở được AR trên thiết bị này.';
});

// Quay lại quét thẻ khác (cú chạm mới cho phép mở lại camera)
$('rescan').addEventListener('click', async () => {
  showLoad('Đang mở camera...');
  try { await startScan(); } catch (e) { setHint('Không mở lại được camera: ' + e.message); }
  hideLoad();
});

/* ══════════ Khởi động ══════════ */
$('go').addEventListener('click', async () => {
  $('go').disabled = true; $('msg').textContent = 'Đang tải dữ liệu thẻ bài...';
  try {
    bundle = bundle || await loadBundle();
    $('msg').textContent = 'Đang mở camera...';
    await startScan();
    $('intro').style.display = 'none';
  } catch (e) {
    console.error(e);
    $('msg').textContent = e.message || 'Không khởi động được. Hãy cho phép dùng camera và thử lại.';
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
